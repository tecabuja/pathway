<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live game · big screen</title>
<link rel="icon" href="img/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#1B1530;color:#fff;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;padding:2.2vh 3vw}
.top{display:flex;align-items:center;gap:16px;font-weight:700;font-size:2vh;opacity:.9}.top .sp{flex:1}
.btn{border:0;border-radius:14px;padding:1.4vh 2.4vw;font-weight:800;font-size:2.2vh;cursor:pointer;background:#C9A24A;color:#1B1530;font-family:inherit}.btn.ghost{background:rgba(255,255,255,.12);color:#fff}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:0}
.pin{font-size:13vh;font-weight:800;letter-spacing:.12em;line-height:1}.join{font-size:3vh;opacity:.85}
.qr{background:#fff;border-radius:16px;padding:1.4vh;width:26vh;height:26vh}.qr svg{width:100%;height:100%}
.chips{display:flex;flex-wrap:wrap;gap:1vh;justify-content:center;max-width:90vw;margin-top:2vh}.chips span{background:rgba(255,255,255,.14);border-radius:30px;padding:.8vh 1.6vw;font-weight:700;font-size:2.4vh;animation:pop .3s}
.qtext{font-size:5vh;font-weight:800;max-width:88vw;margin:1vh 0 2vh}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:1.6vh;width:92vw}.ans div{border-radius:18px;padding:3vh 2vw;font-size:3.6vh;font-weight:800;text-align:left;display:flex;align-items:center;gap:1.4vw;position:relative;overflow:hidden}
.ans div.dim{opacity:.35}.ans b{font-size:4vh}.ans .cnt{margin-left:auto;font-size:3vh;background:rgba(0,0,0,.25);border-radius:12px;padding:.4vh 1vw}
.ring{width:13vh;height:13vh;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#C9A24A var(--p),rgba(255,255,255,.15) 0)}.ring span{width:10.4vh;height:10.4vh;border-radius:50%;background:#1B1530;display:grid;place-items:center;font-size:5vh;font-weight:800}
.qimg{max-height:28vh;max-width:60vw;border-radius:14px;margin-bottom:1vh}
.lb{width:min(900px,90vw)}.lb div{display:flex;align-items:center;gap:2vw;background:rgba(255,255,255,.08);border-radius:14px;padding:1.4vh 2vw;margin-bottom:1vh;font-size:3vh;font-weight:700;animation:pop .35s both}.lb div:first-child{background:rgba(201,162,74,.35)}.lb .n{flex:1;text-align:left}
.pod{display:flex;align-items:flex-end;gap:2vw;margin-top:3vh}.pod>div{text-align:center;width:16vw}.pod .blk{border-radius:14px 14px 0 0;display:grid;place-items:center;font-size:6vh;font-weight:800;color:#1B1530}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}@keyframes conf{0%{transform:translateY(-5vh) rotate(0)}100%{transform:translateY(110vh) rotate(600deg)}}
.err{background:#E5533D;border-radius:12px;padding:1vh 2vw;margin:1vh 0}
</style>
</head>
<body><div id="app"><div class="center"><div class="join">Starting the game…</div></div></div>
<script src="config.js"></script><script src="core.js"></script><script src="lib/qrcode.js"></script><script src="host.js"></script>
</body></html>
