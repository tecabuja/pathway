<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Join the game</title><meta name="theme-color" content="#5B3C88">
<link rel="icon" href="img/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:linear-gradient(160deg,#5B3C88,#E0607E);color:#fff}
#app{max-width:520px;margin:0 auto;padding:18px 16px 30px;min-height:100vh;display:flex;flex-direction:column}
.card{background:#fff;color:#1d2b29;border-radius:20px;padding:18px;margin-bottom:12px;box-shadow:0 10px 30px rgba(0,0,0,.15)}
.inp{width:100%;border:2px solid #e6e0d4;border-radius:14px;padding:14px;font:inherit;font-size:18px;text-align:center}
.btn{width:100%;border:0;border-radius:14px;padding:15px;font:inherit;font-weight:800;font-size:17px;background:#C9A24A;color:#1B1530;cursor:pointer;margin-top:10px}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:1}.ans button{border:0;border-radius:18px;color:#fff;font:inherit;font-weight:800;font-size:18px;min-height:110px;cursor:pointer;padding:10px}.ans button:active{transform:scale(.97)}
.ans button b{display:block;font-size:30px}
.big{font-size:44px;text-align:center}.mid{text-align:center;font-size:20px;font-weight:800}.small{font-size:13px;opacity:.85;text-align:center}
.top{display:flex;justify-content:space-between;font-weight:700;margin-bottom:12px}
.ord div{display:flex;align-items:center;gap:8px;background:#fff;color:#1d2b29;border-radius:14px;padding:12px;margin-bottom:8px;font-weight:700}.ord span{flex:1}.ord button{border:0;background:#eee;border-radius:10px;width:40px;height:40px;font-size:18px}
.res{border-radius:20px;padding:30px 16px;text-align:center}
</style>
</head>
<body><div id="app"></div>
<script src="config.js"></script><script src="core.js"></script><script src="play.js"></script>
</body></html>
