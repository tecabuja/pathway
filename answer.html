<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Answer · The Elevation Church</title>
<meta name="theme-color" content="#2E7770">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>body{background:linear-gradient(180deg,var(--teal-d) 0,var(--teal) 220px,var(--bg) 220px)}.reg{padding:24px 16px 40px}.phoneframe{width:460px}.hp{position:absolute;left:-9999px}
.q{margin-bottom:18px}.q>label,.q>.ql{display:block;font-weight:700;margin-bottom:8px}.q .req{color:var(--red)}.stars{display:flex;gap:6px}.stars button{font-size:30px;line-height:1;background:none;border:0;cursor:pointer;color:#d8d2c4;padding:2px}.stars button.on{color:var(--gold)}
.chips.big .chip{padding:10px 14px;font-size:14px}</style>
</head>
<body>
<div class="reg">
  <div class="phoneframe">
    <div class="hd"><div class="logo-chip"><img src="img/logo-full.png" alt="The Elevation Church"></div>
      <b style="font-size:18px;display:block" id="atitle">Loading…</b><div class="small" style="opacity:.9" id="asub"></div></div>
    <form class="bd" id="af" autocomplete="on" hidden></form>
    <div class="bd" id="amsg" hidden style="text-align:center;padding:30px 20px"></div>
  </div>
  <p class="small muted" style="text-align:center;margin-top:16px" id="afoot">Your answers are kept safely by the church and used only for this purpose.</p>
</div>
<div class="toast" id="toast"></div>
<script src="config.js"></script>
<script src="core.js"></script>
<script src="answer.js"></script>
</body>
</html>
